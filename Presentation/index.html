<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meshcore Drenthe Presentatie</title>
  <meta name="description" content="Interactieve presentatie over Meshcore Drenthe met gesproken uitleg">
  <link rel="stylesheet" href="presentation.css">
</head>
<body>
  <!-- Presentation Container -->
  <div id="presentation-container" class="presentation">
    
    <!-- Slide Display Area -->
    <div id="slide-container" class="slide-container">
      <!-- Slides will be dynamically inserted here -->
    </div>

    <!-- Controls Panel -->
    <div class="controls-panel">
      
      <!-- Navigation Controls -->
      <div class="navigation-controls">
        <button id="btn-prev" class="nav-btn" aria-label="Vorige slide">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="15 18 9 12 15 6"></polyline>
          </svg>
        </button>
        
        <div class="slide-counter">
          <span id="current-slide">1</span>
          <span>/</span>
          <span id="total-slides">7</span>
        </div>
        
        <button id="btn-next" class="nav-btn" aria-label="Volgende slide">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="9 18 15 12 9 6"></polyline>
          </svg>
        </button>
      </div>
    </div>

    <!-- Progress Bar -->
    <div class="progress-bar">
      <div id="progress-fill" class="progress-fill"></div>
    </div>

    <!-- Subtitles Display -->
    <div id="subtitles" class="subtitles" aria-live="polite" aria-atomic="true"></div>

    <!-- PDCA Status Indicator -->
    <div id="pdca-indicator" class="pdca-indicator">
      <span class="pdca-phase">Plan</span>
    </div>
  </div>

  <!-- Loading Indicator -->
  <div id="loading" class="loading" style="display:none;">
    <div class="spinner"></div>
    <p>Presentatie laden...</p>
  </div>

  <!-- Application Entry Point -->
  <script type="module" src="app.js"></script>
</body>
</html>
