<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meshcore Drenthe Presentatie</title>
  <meta name="description" content="Interactieve presentatie over Meshcore Drenthe met gesproken uitleg">
  <link rel="stylesheet" href="presentation.css">
</head>
<body>
  <!-- Presentation Container -->
  <div id="presentation-container" class="presentation">
    
    <!-- Slide Display Area -->
    <div id="slide-container" class="slide-container">
      <!-- Slides will be dynamically inserted here -->
    </div>

    <!-- Progress Bar -->
    <div class="progress-bar">
      <div id="progress-fill" class="progress-fill"></div>
    </div>

    <!-- Page Timer (60 seconds countdown) -->
    <div id="page-timer" class="page-timer">
      <div class="timer-circle">
        <svg class="timer-svg" viewBox="0 0 100 100">
          <circle class="timer-bg" cx="50" cy="50" r="45"></circle>
          <circle id="timer-progress" class="timer-progress" cx="50" cy="50" r="45"></circle>
        </svg>
        <div class="timer-text">
          <span id="timer-seconds">60</span>
        </div>
      </div>
    </div>

    <!-- PDCA Status Indicator -->
    <div id="pdca-indicator" class="pdca-indicator">
      <span class="pdca-phase">Plan</span>
    </div>
  </div>

  <!-- Start Overlay (requires user interaction for speech) -->
  <div id="start-overlay" class="start-overlay">
    <div class="start-content">
      <h1>Meshcore Drenthe Presentatie</h1>
      <p>Automatische presentatie met Nederlandse voice-over</p>
      <button id="start-btn" class="start-btn">Start Presentatie</button>
      <p class="start-info">🔊 Zorg dat je geluid aan staat</p>
    </div>
  </div>

  <!-- Loading Indicator -->
  <div id="loading" class="loading" style="display:none;">
    <div class="spinner"></div>
    <p>Presentatie laden...</p>
  </div>

  <!-- Application Entry Point -->
  <script type="module" src="app.js"></script>
</body>
</html>
