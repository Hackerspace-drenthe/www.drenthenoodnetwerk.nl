<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, height=1080">
  <title>Call to Action - Meshcore Drenthe</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 1920px;
      height: 1080px;
      background: linear-gradient(135deg, #0a1628 0%, #1a2332 50%, #0f1f36 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      position: relative;
    }

    /* Decorative elements */
    body::before {
      content: '';
      position: absolute;
      width: 800px;
      height: 800px;
      background: radial-gradient(circle, rgba(244, 162, 97, 0.15) 0%, transparent 70%);
      border-radius: 50%;
      top: -200px;
      right: -200px;
      animation: pulse 4s ease-in-out infinite;
    }

    body::after {
      content: '';
      position: absolute;
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(42, 157, 143, 0.12) 0%, transparent 70%);
      border-radius: 50%;
      bottom: -150px;
      left: -150px;
      animation: pulse 5s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 0.5; }
      50% { transform: scale(1.1); opacity: 0.7; }
    }

    .container {
      text-align: center;
      z-index: 10;
      padding: 60px;
    }

    h1 {
      font-size: 120px;
      font-weight: 800;
      color: #ffffff;
      margin-bottom: 40px;
      text-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
      letter-spacing: -2px;
    }

    .subtitle {
      font-size: 48px;
      color: #f4a261;
      margin-bottom: 100px;
      font-weight: 600;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
    }

    .websites {
      display: flex;
      flex-direction: column;
      gap: 60px;
      margin-bottom: 80px;
    }

    .website-box {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(20px);
      border: 3px solid rgba(244, 162, 97, 0.4);
      border-radius: 30px;
      padding: 50px 80px;
      transition: all 0.3s ease;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
    }

    .website-box:hover {
      transform: translateY(-5px);
      border-color: rgba(244, 162, 97, 0.8);
      box-shadow: 0 15px 50px rgba(244, 162, 97, 0.2);
    }

    .website-label {
      font-size: 36px;
      color: #a0a0a0;
      margin-bottom: 15px;
      text-transform: uppercase;
      letter-spacing: 2px;
      font-weight: 600;
    }

    .website-url {
      font-size: 72px;
      color: #ffffff;
      font-weight: 700;
      font-family: 'Courier New', monospace;
      text-shadow: 0 2px 15px rgba(244, 162, 97, 0.4);
      letter-spacing: -1px;
    }

    .qr-placeholder {
      display: inline-block;
      width: 150px;
      height: 150px;
      background: rgba(255, 255, 255, 0.9);
      border-radius: 15px;
      margin: 0 30px;
      box-shadow: 0 5px 20px rgba(0, 0, 0, 0.4);
      position: relative;
    }

    .qr-placeholder::after {
      content: 'QR';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 32px;
      font-weight: 900;
      color: #0a1628;
      opacity: 0.3;
    }

    .qr-row {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 40px;
      margin-top: 60px;
    }

    .footer {
      font-size: 40px;
      color: #2a9d8f;
      font-weight: 600;
      margin-top: 50px;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
    }

    /* Mesh network pattern background */
    .mesh-pattern {
      position: absolute;
      width: 100%;
      height: 100%;
      opacity: 0.05;
      background-image: 
        repeating-linear-gradient(90deg, transparent, transparent 100px, #f4a261 100px, #f4a261 102px),
        repeating-linear-gradient(0deg, transparent, transparent 100px, #f4a261 100px, #f4a261 102px);
      z-index: 1;
    }

    .logo-area {
      position: absolute;
      top: 50px;
      left: 50px;
      display: flex;
      align-items: center;
      gap: 20px;
      z-index: 10;
    }

    .logo-text {
      font-size: 32px;
      color: #f4a261;
      font-weight: 700;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
    }
  </style>
</head>
<body>
  <div class="mesh-pattern"></div>
  
  <div class="logo-area">
    <div class="logo-text">MESHCORE DRENTHE</div>
  </div>

  <div class="container">
    <h1>Doe Mee!</h1>
    <div class="subtitle">Word onderdeel van het netwerk</div>

    <div class="websites">
      <div class="website-box">
        <div class="website-label">Hackavonden & Community</div>
        <div class="website-url">hackerspace-drenthe.nl</div>
      </div>

      <div class="website-box">
        <div class="website-label">Netwerk & Technologie</div>
        <div class="website-url">drenthenoodnetwerk.nl</div>
      </div>
    </div>

    <div class="footer">
      🔗 Samen bouwen aan een robuust noodnetwerk
    </div>
  </div>
</body>
</html>
